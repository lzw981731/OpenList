name: Sync Upstream

on:
  schedule:
    # 姣忓ぉ鍖椾含鏃堕棿 02:00 鎵ц (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: '寮哄埗鍚屾锛堝拷鐣ュ啿绐佹鏌ワ級'
        required: false
        default: 'false'
        type: boolean

# 椤跺眰鏉冮檺閰嶇疆
permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_REPO: OpenListTeam/OpenList
  UPSTREAM_BRANCH: main
  CUSTOM_DRIVER: guangyapan
  CUSTOM_IMPORT: '_ "github.com/OpenListTeam/OpenList/v4/drivers/guangyapan"'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Check for updates
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "Already up to date"
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "Updates available"
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "behind=$(git rev-list --count HEAD..upstream/${{ env.UPSTREAM_BRANCH }})" >> $GITHUB_OUTPUT
            echo "upstream_sha=$UPSTREAM" >> $GITHUB_OUTPUT
          fi

      - name: Backup custom driver
        if: steps.check.outputs.has_updates == 'true'
        run: |
          mkdir -p /tmp/backup
          cp -r drivers/${{ env.CUSTOM_DRIVER }} /tmp/backup/
          echo "Backed up drivers/${{ env.CUSTOM_DRIVER }}"

      - name: Create sync branch and merge
        if: steps.check.outputs.has_updates == 'true'
        id: merge
        run: |
          SYNC_BRANCH="sync-upstream-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $SYNC_BRANCH
          
          # 灏濊瘯鍚堝苟涓婃父
          if git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-commit --no-edit; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "sync_branch=$SYNC_BRANCH" >> $GITHUB_OUTPUT
          else
            echo "merge_success=false" >> $GITHUB_OUTPUT
            echo "sync_branch=$SYNC_BRANCH" >> $GITHUB_OUTPUT
            # 淇濈暀鍐茬獊鐘舵€侊紝鍚庣画澶勭悊
          fi

      - name: Restore custom driver
        if: steps.check.outputs.has_updates == 'true'
        run: |
          # 纭繚鐩綍瀛樺湪
          mkdir -p drivers/${{ env.CUSTOM_DRIVER }}
          cp -r /tmp/backup/${{ env.CUSTOM_DRIVER }}/* drivers/${{ env.CUSTOM_DRIVER }}/
          echo "Restored drivers/${{ env.CUSTOM_DRIVER }}"

      - name: Inject custom driver import
        if: steps.check.outputs.has_updates == 'true'
        run: |
          # 妫€鏌?all.go 鏄惁宸插寘鍚?guangyapan import
          if ! grep -q "${{ env.CUSTOM_DRIVER }}" drivers/all.go; then
            echo "Injecting ${{ env.CUSTOM_DRIVER }} import..."
            
            # 鍦?import 鍧楃殑鏈€鍚庝竴涓?_ "github.com/..." 鍚庢彃鍏?            # 浣跨敤 sed 鍦?yandex_disk 琛屽悗娣诲姞锛堝鏋滃瓨鍦級
            if grep -q 'yandex_disk' drivers/all.go; then
              sed -i '/_ "github.com\/OpenListTeam\/OpenList\/v4\/drivers\/yandex_disk"/a\'$'\t''"${{ env.CUSTOM_IMPORT }}"' drivers/all.go
            else
              # 濡傛灉娌℃湁 yandex_disk锛屽湪鏈€鍚庝竴涓?_ "github.com/..." 琛屽悗鎻掑叆
              sed -i '/^)$/i\'$'\t''"${{ env.CUSTOM_IMPORT }}"' drivers/all.go
            fi
            
            echo "Import injected successfully"
          else
            echo "Import already exists"
          fi

      - name: Resolve conflicts if merge failed
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_success == 'false'
        run: |
          echo "::warning::Merge conflicts detected!"
          
          # 瀵逛簬 all.go锛屽皾璇曡嚜鍔ㄨВ鍐?          if git status --porcelain | grep -q "drivers/all.go"; then
            # 淇濈暀涓婃父鐗堟湰锛屽悗缁墜鍔ㄦ敞鍏?            git checkout --theirs drivers/all.go
            git add drivers/all.go
          fi
          
          # 鏍囪鍏朵粬鍐茬獊鏂囦欢
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          echo "conflicts<<EOF" >> $GITHUB_ENV
          echo "$CONFLICTS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Commit and push
        if: steps.check.outputs.has_updates == 'true'
        id: commit
        run: |
          git add -A

          # 妫€鏌ユ槸鍚︽湁鍙樻洿
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "sync: merge upstream ${{ env.UPSTREAM_REPO }} (${{ steps.check.outputs.behind }} commits)

            - Synced from: ${{ env.UPSTREAM_REPO }}/${{ env.UPSTREAM_BRANCH }}
            - Custom driver: ${{ env.CUSTOM_DRIVER }} preserved
            - Auto-injected: ${{ env.CUSTOM_DRIVER }} import to all.go"

            git push origin ${{ steps.merge.outputs.sync_branch }}
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true' && steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          SYNC_BRANCH: ${{ steps.merge.outputs.sync_branch }}
        with:
          script: |
            const syncBranch = process.env.SYNC_BRANCH;
            console.log(`Creating PR for branch: ${syncBranch}`);
            
            // 楠岃瘉鍒嗘敮瀛樺湪
            try {
              const { data: ref } = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${syncBranch}`
              });
              console.log(`Branch found: ${ref.ref}`);
            } catch (error) {
              console.error(`Branch not found: ${syncBranch}`);
              console.error(error);
              core.setFailed(`Branch ${syncBranch} does not exist on remote`);
              return;
            }
            
            const mergeSuccess = '${{ steps.merge.outputs.merge_success }}' === 'true';
            const behind = '${{ steps.check.outputs.behind }}';
            const conflicts = process.env.conflicts || '';
            
            let body = `## 馃攧 Upstream Sync\n\n`;
            body += `**Source:** ${{ env.UPSTREAM_REPO }}/${{ env.UPSTREAM_BRANCH }}\n`;
            body += `**Commits behind:** ${behind}\n\n`;
            
            body += `### 鉁?Preserved Custom Content\n`;
            body += `- \`drivers/${{ env.CUSTOM_DRIVER }}/\` directory\n`;
            body += `- \`drivers/all.go\` import injection\n\n`;
            
            if (!mergeSuccess) {
              body += `### 鈿狅笍 Merge Conflicts Detected\n`;
              body += `The following files have conflicts that need manual resolution:\n\n`;
              body += '```\n' + conflicts + '\n```\n\n';
              body += `**Please resolve conflicts before merging.**\n`;
            } else {
              body += `### 鉁?No Conflicts\n`;
              body += `This PR can be merged automatically.\n`;
            }
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `sync: upstream ${{ env.UPSTREAM_REPO }} (${behind} commits)`,
              body: body,
              head: syncBranch,
              base: 'main',
              maintainer_can_modify: true
            });
            
            console.log(`Created PR #${pr.number}: ${pr.html_url}`);
            
            // 娣诲姞鏍囩
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['upstream-sync', 'automated']
            });
            
            // 濡傛灉鏈夊啿绐侊紝娣诲姞璇勮鎻愰啋
            if (!mergeSuccess) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `鈿狅笍 **Conflicts detected!**\n\nPlease resolve the following files manually:\n\`\`\`\n${conflicts}\n\`\`\`\n\nDon't forget to verify that \`drivers/${{ env.CUSTOM_DRIVER }}/\` is preserved.`
              });
            }


      - name: Create Release
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_success == 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream_sha }}
          BEHIND: ${{ steps.check.outputs.behind }}
        with:
          script: |
            const upstreamSha = process.env.UPSTREAM_SHA;
            const behind = process.env.BEHIND;

            // 浠庝笂娓镐粨搴撹幏鍙栨渶鏂?tag锛堜笉鏄綋鍓嶄粨搴擄級
            const { data: upstreamTags } = await github.rest.repos.listTags({
              owner: '${{ env.UPSTREAM_REPO }}'.split('/')[0],
              repo: '${{ env.UPSTREAM_REPO }}'.split('/')[1],
              per_page: 20
            });

            // 杩囨护鎺?beta銆乤lpha 绛夐鍙戝竷鏍囩锛屽彧鍙栨寮忕増鏈?            const stableTags = upstreamTags.filter(tag => 
              !tag.name.includes('beta') && 
              !tag.name.includes('alpha') && 
              !tag.name.includes('rc') &&
              /^v?\d+\.\d+\.\d+$/.test(tag.name)
            );

            let newVersion;
            if (stableTags && stableTags.length > 0) {
              newVersion = stableTags[0].name.replace('v', '');
              console.log(`Using upstream stable version: v${newVersion}`);
            } else if (upstreamTags && upstreamTags.length > 0) {
              // 濡傛灉娌℃湁姝ｅ紡鐗堟湰锛屼娇鐢ㄦ渶鏂扮殑 tag
              newVersion = upstreamTags[0].name.replace('v', '');
              console.log(`Using upstream latest version: v${newVersion}`);
            } else {
              newVersion = `0.0.0-${upstreamSha.substring(0, 7)}`;
              console.log(`No upstream tags, using SHA-based version: v${newVersion}`);
            }

            const tagName = `v${newVersion}`;

            // 妫€鏌?tag 鏄惁宸插瓨鍦?            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
              console.log(`Tag ${tagName} already exists, skipping release`);
              return;
            } catch (error) {
              // Tag 涓嶅瓨鍦紝缁х画鍒涘缓
            }

            // 鍒涘缓 tag
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tagName}`,
              sha: context.sha
            });

            // 鍒涘缓 Release
            const releaseBody = "## Upstream Sync Release\n\n" +
              "**Version:** " + tagName + "\n" +
              "**Source:** OpenListTeam/OpenList\n" +
              "**Synced commits:** " + behind + "\n" +
              "**Upstream SHA:** " + upstreamSha + "\n\n" +
              "### What Changed\n" +
              "- Synced from upstream repository\n" +
              "- Custom driver guangyapan preserved\n";

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: tagName,
              body: releaseBody,
              draft: false,
              prerelease: false
            });

            console.log(`Created release: ${release.html_url}`);

      - name: Cleanup
        if: always()
        run: |
          git checkout main || true
          git branch -D ${{ steps.merge.outputs.sync_branch }} 2>/dev/null || true
          rm -rf /tmp/backup
